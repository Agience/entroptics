name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:                       # cancel superseded runs on the same ref
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast matrix: numpy + scipy only (no torch). The numpy/torch parity tests
  # skip themselves via pytest.importorskip("torch").
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest

  # One job with torch, installed as the CPU-only wheel (the default Linux
  # torch wheel bundles CUDA and is multi-GB). Covers the parity tests.
  test-torch:
    name: test (numpy/torch parity, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"   # torch already satisfied by the CPU wheel
      - run: pytest
